onboarding = false

# Shared checkout root for Herdr and other worktree tools.
[worktrees]
directory = "~/worktrees"

# Declare the theme explicitly so plugins can inherit it.
[theme]
name = "catppuccin"

[experimental]
kitty_graphics = true

[keys]
prefix = "ctrl+space"
switch_workspace = "ctrl+alt+1..9"
goto = ""
last_pane = "prefix+o"
edit_scrollback = "prefix+shift+e"
new_worktree = ""
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
# Reserve prefix+r for code review; resize directly with Alt+h/j/k/l.
resize_mode = ""
resize_pane_left = "alt+h"
resize_pane_down = "alt+j"
resize_pane_up = "alt+k"
resize_pane_right = "alt+l"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "vjeantet.palette.open"
description = "search commands"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "herdr-navigator.open"
description = "search workspaces, agents, and projects"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "switch or create worktree"

# Let Neovim handle its own splits before crossing a Herdr pane boundary.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "navigate left (Neovim/Herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "navigate down (Neovim/Herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "navigate up (Neovim/Herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "navigate right (Neovim/Herdr)"

[[keys.command]]
key = "prefix+shift+i"
type = "popup"
command = "gh dash"
description = "browse GitHub pull requests"
width = "95%"
height = "90%"

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "jmarbutt.spaces-pr-status.board"
description = "workspace PR board"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "jmarbutt.spaces-pr-status.open"
description = "open current branch PR in GitHub"

[[keys.command]]
key = "prefix+r"
type = "shell"
command = "$HOME/.local/bin/herdr-review"
description = "review changes in tuicr"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "toggle Neovim sidebar"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file in Neovim sidebar"

[[keys.command]]
key = "prefix+m"
type = "shell"
command = "$HOME/.local/bin/micro"
description = "open micro"

[ui]
# Automatic naming adopts new tabs; manually named tabs keep their labels.
prompt_new_tab_name = false
status_indicators = "dots"
sidebar_max_width = 40

[ui.toast]
# herdr-focus-notify owns desktop notifications and their click-to-focus action.
delivery = "off"

# Distinguish micro while preserving the normal colors of other workspaces.
[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", { token = "workspace", rules = [{ equals = "micro", fg = "#fab387", bold = true }] }],
  ["tab"],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", rules = [{ equals = "micro", fg = "#fab387", bold = true }] }],
  ["branch", "git_status"],
  [{ token = "$pr", fg = "#89b4fa", bold = true }, "$pr_checks", "$pr_review"],
  [{ token = "$pr_threads", fg = "#9399b2" }],
]
