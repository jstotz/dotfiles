id = "dotfiles.review"
name = "Code review"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Review code in tuicr and send comments to agents."
platforms = ["macos", "linux"]

[[panes]]
id = "tuicr"
title = "Code review"
# A normal tab keeps smart-splits from navigating into the pane behind a zoom.
placement = "tab"
command = ["zsh", "-lc", 'exec bun "$HOME/.local/lib/herdr-review/session.ts"']
