# Match the Catppuccin flavors used by Neovim and Herdr.
theme_dark = "catppuccin-mocha"
theme_light = "catppuccin-latte"
# Herdr launches tuicr from a login shell that does not read .zshrc.
editor = "nvim"
# Homebrew manages upgrades.
no_update_check = true
# Vim modes in the comment box; save with :w or Alt-Enter.
comment_vim = true
# Re-read the local diff so commits and new edits appear without :e.
diff_watch_interval_ms = 2000
# libgit2 keeps a stale index after outside commits; the git CLI stays current.
backend = "cli"
